# Sujet : suivi multi-objets appliqué aux poids lourds

tracker_type: botsort

track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.25

# Augmenté par rapport au défaut (30) : les poids lourds masquent souvent
# d'autres véhicules plus longtemps qu'une petite voiture, on garde donc
# une piste "perdue" plus longtemps avant de l'abandonner.
track_buffer: 60

match_thresh: 0.8
fuse_score: True

gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.8

# Le changement clé par rapport à bytetrack.yaml
with_reid: True   # active la ré-identification par apparence
model: auto       # utilise les features du détecteur